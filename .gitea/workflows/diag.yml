name: Diag
on:
  workflow_dispatch:
jobs:
  net:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          for h in github.com api.github.com objects.githubusercontent.com github-releases.githubusercontent.com release-assets.githubusercontent.com pypi.org files.pythonhosted.org registry.npmjs.org nodejs.org astral.sh go.dev nas.virson.cn:10088; do
            printf '%-50s' "$h"
            curl -sS -o /dev/null -m 15 -w '%{http_code} %{remote_ip} http%{http_version}\n' "https://$h/" 2>&1 | tail -1
          done
          echo "--- alpn http1.1 forced"
          curl -sS -o /dev/null -m 15 --http1.1 -w '%{http_code}\n' https://api.github.com/ 2>&1 | tail -1
          cat /etc/resolv.conf; uname -m; nproc; free -g | head -2; df -h / | tail -1
          node --version; which docker python3 gh make unzip zip rpm dpkg fakeroot || true
