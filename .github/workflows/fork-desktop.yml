name: Fork Desktop

# Fork 专用桌面客户端流水线（与官方 octop-desktop.yml 无关，该文件保持不动）。
#
# 触发：
#   - 推送 fork-v* 标签（与 fork-release.yml 同时触发）
#   - 或在 Actions 页面手动运行，填写已存在的标签
#
# 产物：6 个平台的桌面客户端，挂到同名 GitHub Release：
#   Octop-desktop-<平台>-<版本>.*，平台为 linux/darwin/windows × amd64/arm64：
#   macOS 为 dmg + zip，Windows 为 exe（NSIS 安装包），Linux 为 deb + rpm（均由官方 Electron 壳打包）。
#   不发布绿色版 zip（它只是打包桌面客户端的中间产物）。
#
# 不做的事：不签名（macOS 为 ad-hoc 签名，Windows 无签名），不上传 COS。
#
# 只用 Actions 白名单里的 Action（checkout@v4、setup-node@v4、upload-artifact@v4、
# download-artifact@v4、astral-sh/setup-uv@v4）；pnpm 用 corepack 启用、Release 上传用 gh 命令，
# 不需要改白名单。打包步骤复制自官方 octop-desktop.yml 的 package job，官方调整时同步到这里。
#
# 版本号：官方 electron-builder.config.ts 只认 1.0.3b4 这类版本，不认 fork 的 .postN 后缀，
# 所以 electron-builder 用去掉 .postN 的基础版本，打完再把安装包文件名改回完整版本。
#
# Release 由 fork-release.yml 创建；本文件的发布 job 会等它出现后再上传。

on:
  push:
    tags:
      - "fork-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要打包的已有标签，例如 fork-v1.0.3b1.post3"
        required: true
        type: string
      platforms:
        description: "平台，逗号分隔，或 all"
        required: false
        default: "all"
        type: string

permissions:
  contents: write

concurrency:
  group: fork-desktop-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PBS_BASE_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20251209
  PBS_TAG: "20251209"
  PBS_PY: "3.12.12"

jobs:
  prepare:
    name: Resolve version and platforms
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      base_version: ${{ steps.ver.outputs.base_version }}
      matrix: ${{ steps.ver.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check tag and select platforms
        id: ver
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          set -euo pipefail
          case "$TAG" in
            fork-v*) ;;
            *) echo "::error::标签必须以 fork-v 开头，收到 $TAG"; exit 1 ;;
          esac
          VER="${TAG#fork-v}"
          PYVER=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' pyproject.toml | head -1)
          if [ "$VER" != "$PYVER" ]; then
            echo "::error::标签 $TAG 与 pyproject.toml 版本 $PYVER 不一致"
            exit 1
          fi
          export BASE_VER="$(printf '%s' "$VER" | sed -E 's/\.post[0-9]+$//')"
          python3 <<'PY'
          import json
          import os

          all_plats = [
              {"plat": "linux-amd64", "arch": "amd64", "os": "ubuntu-latest"},
              {"plat": "linux-arm64", "arch": "arm64", "os": "ubuntu-24.04-arm"},
              {"plat": "darwin-arm64", "arch": "arm64", "os": "macos-15"},
              {"plat": "darwin-amd64", "arch": "amd64", "os": "macos-15-intel"},
              {"plat": "windows-amd64", "arch": "amd64", "os": "windows-latest"},
              {"plat": "windows-arm64", "arch": "arm64", "os": "windows-11-arm"},
          ]
          sel = os.environ["PLATFORMS"].lower().replace(" ", "")
          if sel == "all":
              include = all_plats
          else:
              wanted = {p for p in sel.split(",") if p}
              unknown = wanted - {r["plat"] for r in all_plats}
              if unknown:
                  raise SystemExit(f"unknown platform(s): {', '.join(sorted(unknown))}")
              include = [r for r in all_plats if r["plat"] in wanted]
          if not include:
              raise SystemExit(f"no platforms selected: {sel}")
          tag = os.environ["TAG"]
          matrix = json.dumps({"include": include}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(
                  f"tag={tag}\nversion={tag[len('fork-v'):]}\n"
                  f"base_version={os.environ['BASE_VER']}\nmatrix={matrix}\n"
              )
          PY

  frontend:
    name: Build dashboard
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build frontend → src/octop/dashboard
        run: make build-frontend

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: src/octop/dashboard/
          if-no-files-found: error
          retention-days: 3

  package:
    name: "${{ matrix.plat }}"
    needs: [prepare, frontend]
    runs-on: ${{ matrix.os }}
    env:
      GREEN_HOST_PLAT: ${{ matrix.plat }}
      OCTOP_VERSION: ${{ needs.prepare.outputs.version }}
      BASE_VERSION: ${{ needs.prepare.outputs.base_version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: src/octop/dashboard

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Bootstrap portable CPython
        run: bash desktop/portable/bootstrap-runtime.sh "${{ matrix.plat }}"

      - name: Assemble green zip (intermediate, not published)
        run: bash desktop/portable/package.sh "${{ matrix.plat }}"

      - name: Smoke import (native host only)
        run: |
          set -euo pipefail
          staging="desktop/portable/release/Octop-${{ matrix.plat }}"
          if [[ -x "${staging}/runtime/bin/python3" ]]; then
            py="${staging}/runtime/bin/python3"
          elif [[ -f "${staging}/runtime/python.exe" ]]; then
            py="${staging}/runtime/python.exe"
          else
            echo "python missing under ${staging}/runtime" >&2
            exit 1
          fi
          req_file="desktop/portable/requirements-${{ matrix.plat }}.txt"
          if [[ ! -f "$req_file" ]]; then
            echo "frozen requirements missing: ${req_file}" >&2
            exit 1
          fi
          verify_args=(
            --packages "${staging}/packages"
            --requirements "$req_file"
          )
          override_file="desktop/portable/overrides-${{ matrix.plat }}.txt"
          if [[ -f "$override_file" ]]; then
            verify_args+=(--overrides "$override_file")
          fi
          PYTHONNOUSERSITE=1 \
            "$py" desktop/portable/verify_imports.py \
              "${verify_args[@]}"
          if [[ "${{ matrix.plat }}" == darwin-* ]]; then
            REPO_ROOT="$PWD" # shellcheck source=desktop/portable/_common.sh
            source desktop/portable/_common.sh
            verify_no_homebrew_dylibs "${staging}/packages" "${{ matrix.plat }}"
          fi

      # 官方 Stage Electron runtime：Windows 带整个 zip（NSIS 安装时解压），其余平台带已展开的目录。
      - name: Stage Electron runtime
        run: |
          set -euo pipefail
          plat="${{ matrix.plat }}"
          zip="desktop/portable/release/Octop-portable-${plat}-${OCTOP_VERSION}.zip"
          rm -rf desktop/src/resources/portable
          mkdir -p desktop/src/resources/portable
          test -f "desktop/portable/release/Octop-${plat}/packages/octop/dashboard/index.html"
          if [[ "$plat" == windows-* ]]; then
            cp "$zip" desktop/src/resources/portable/
          else
            inner="desktop/portable/release/Octop-${plat}"
            if [[ ! -f "$inner/launch.py" ]]; then
              echo "expanded portable tree has no launch.py under ${inner}" >&2
              exit 1
            fi
            shopt -s dotglob
            cp -a "$inner"/. desktop/src/resources/portable/
            shopt -u dotglob
            test -x desktop/src/resources/portable/runtime/bin/python3
            test ! -e desktop/src/resources/portable/*.zip
          fi
          if [[ "$plat" == windows-* ]]; then py=python; else py=python3; fi
          "$py" - "$zip" "$OCTOP_VERSION" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import zipfile

          path = pathlib.Path(sys.argv[1])
          if not zipfile.is_zipfile(path):
              raise SystemExit(f"not a portable zip: {path}")
          manifest = {"version": sys.argv[2], "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
          dest = pathlib.Path("desktop/src/resources/portable/portable-version.json")
          dest.write_text(json.dumps(manifest) + "\n", encoding="utf-8")
          print(f"Bundled {path.name} with SHA-256 {manifest['sha256']}")
          PY
          if [[ "$plat" != windows-* ]]; then
            test -f desktop/src/resources/portable/packages/octop/dashboard/index.html
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # pnpm/action-setup 不在白名单里；官方固定 pnpm 12.15.0（desktop/src/package.json 的 packageManager 同值）。
      - name: Enable pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@12.15.0 --activate
          pnpm --version

      - name: Install and check Electron shell
        working-directory: desktop/src
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run test

      - name: Build native Electron installers
        working-directory: desktop/src
        env:
          OCTOP_PLATFORM: ${{ matrix.plat }}
          # 去掉 .postN 的基础版本，官方配置只认这种格式；打完后下面一步把文件名改回完整版本。
          OCTOP_VERSION: ${{ needs.prepare.outputs.base_version }}
          # 置空而不是不设：runner 环境里有 CSC_LINK 会覆盖 mac.identity: null，导致尝试签名。
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
          WIN_CSC_LINK: ""
          WIN_CSC_KEY_PASSWORD: ""
          APPLE_ID: ""
          APPLE_APP_SPECIFIC_PASSWORD: ""
          APPLE_TEAM_ID: ""
        run: |
          set -euo pipefail
          pnpm run build
          case "${{ matrix.plat }}" in
            darwin-*) target=--mac ;;
            windows-*) target=--win ;;
            linux-*) target=--linux ;;
            *) echo "Unsupported Electron target: ${{ matrix.plat }}" >&2; exit 1 ;;
          esac
          if [[ "${{ matrix.arch }}" == amd64 ]]; then arch=--x64; else arch=--arm64; fi
          pnpm exec electron-builder --config electron-builder.config.ts "$target" "$arch" --publish never

      # 文件名带 fork 的完整版本（含 .postN）；只收安装包，不收 blockmap / latest*.yml 等附带文件。
      - name: Name installers with the full fork version
        run: |
          set -euo pipefail
          rel=desktop/src/release
          ls -lh "$rel"
          mkdir -p desktop/src/publish
          n=0
          for f in "$rel"/Octop-desktop-${{ matrix.plat }}-${BASE_VERSION}.*; do
            case "$f" in
              *.dmg|*.zip|*.exe|*.deb|*.rpm) ;;
              *) continue ;;
            esac
            ext="${f##*.}"
            cp "$f" "desktop/src/publish/Octop-desktop-${{ matrix.plat }}-${OCTOP_VERSION}.${ext}"
            n=$((n + 1))
          done
          if [[ "$n" -eq 0 ]]; then
            echo "no installers found under ${rel}" >&2
            exit 1
          fi
          ls -lh desktop/src/publish

      - uses: actions/upload-artifact@v4
        with:
          name: Octop-desktop-${{ matrix.plat }}
          path: desktop/src/publish/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach desktop packages to Release
    needs: [prepare, package]
    # 某个平台失败（例如 macOS 机器排不上）时，其余平台已打好的包照常上传。
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Octop-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          ls -lh release-assets/
          # Release 由 fork-release.yml 创建（要先跑完测试），最多等 90 分钟。
          for i in $(seq 1 90); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            echo "等待 Release $TAG 创建（$i/90）"
            sleep 60
          done
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" release-assets/* --clobber
